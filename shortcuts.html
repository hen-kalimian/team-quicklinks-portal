<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>קיצורי דרך שימושיים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfcfc;
    --panel:#ffffff;
    --text:#1e2a31;
    --muted:#6c808c;
    --border:#d6e6ee;

    --blue:#467c9c; --blue-dark:#386380; --blue-tint:#f0f7fb;
    --mint:#3a8e69; --mint-dark:#317255; --mint-tint:#f0faf5;
    --gold:#a67a24; --gold-dark:#85601f; --gold-tint:#fbf6e8;
    --rose:#d14175; --rose-dark:#ae2f5f; --rose-tint:#fef1f5;
    --pencil:#52453a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#fbfcfc 0%,#f0f7fb 100%);
    font-family:'Open Sans','Rubik',sans-serif;
    color:var(--text);
    padding:24px 16px 60px;
  }
  h1{font-family:'Rubik',sans-serif;letter-spacing:-0.01em;}

  #wrap{max-width:720px;margin:0 auto;}

  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    color:var(--blue-dark);
    font-weight:600;
    font-size:14px;
    margin-bottom:18px;
    padding:8px 14px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
  }
  .back:hover{background:var(--blue-tint);}

  .page-title{font-size:22px;margin:0 0 4px;color:var(--blue-dark);text-align:center;}
  .page-sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:26px;}

  .item{
    background:var(--panel);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:14px;
    box-shadow:0 1px 3px rgba(30,42,49,0.05);
  }
  .item-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .item .icon{
    flex-shrink:0;
    width:38px;height:38px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
  }
  .item .icon svg{width:21px;height:21px;fill:none;stroke:var(--pencil);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:url(#pencil-rough);}
  .item .cmd{font-family:'Rubik',sans-serif;font-weight:700;font-size:16px;flex:1;}
  .copy-btn{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--blue-dark);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    line-height:1;
    transition:transform .12s, background .2s;
  }
  .copy-btn:hover{transform:scale(1.07);}
  .copy-btn.copied{background:var(--mint-dark);}
  .box{
    background:var(--blue-tint);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.7;
    white-space:pre-wrap;
    color:var(--text);
  }

  .link-btn{
    display:block;
    margin:10px auto 0;
    padding:9px 18px;
    border:none;
    border-radius:10px;
    background:var(--rose-dark);
    color:#fff;
    font-family:'Rubik',sans-serif;
    font-weight:500;
    font-size:14px;
    cursor:pointer;
  }
  .link-btn.copied{background:var(--mint-dark);}
  .search{position:relative;margin-bottom:18px;}
  .search input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:14px;background:#fff;font-family:'Open Sans','Rubik',sans-serif;font-size:16px;color:var(--text);outline:none;}
  .search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(70,124,156,.15);}
  .no-results{text-align:center;color:var(--muted);font-size:14px;padding:20px 0;display:none;}
  .c0 .icon{background:#e0eef5;color:var(--blue-dark);} .c0 .cmd{color:var(--blue-dark);}
  .c1 .icon{background:#ddf3e9;color:var(--mint-dark);} .c1 .cmd{color:var(--mint-dark);}
  .c2 .icon{background:#f6ebc9;color:var(--gold-dark);} .c2 .cmd{color:var(--gold-dark);}
  .c3 .icon{background:#fde1ea;color:var(--rose-dark);} .c3 .cmd{color:var(--rose-dark);}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="pencil-rough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
  </filter>
</svg>
<div id="wrap">
  <a class="back" href="index.html">→ חזרה לקיצורי דרך</a>
  <h1 class="page-title">קיצורי דרך שימושיים</h1>
  <div class="page-sub">לחיצה על העיגול מעתיקה את הטקסט</div>

  <div class="search"><input id="q" type="search" placeholder="חיפוש בקיצורים (למשל: בנק, סילבוס, ביטול)" autocomplete="off"></div>
  <div id="list"></div>
  <div class="no-results" id="none">לא נמצאו קיצורים מתאימים</div>
</div>

<script src="shortcuts-data.js"></script>
<script>

  const list = document.getElementById('list');
  ITEMS.forEach((it, i) => {
    const colorClass = 'c' + (i % 4);
    const div = document.createElement('div');
    div.className = 'item ' + colorClass;
    div.innerHTML = `
      <div class="item-head">
        <span class="icon"><svg viewBox="0 0 24 24">${ICONS[it.icon]}</svg></span>
        <span class="cmd">${it.cmd}</span>
        <button class="copy-btn" type="button">+</button>
      </div>
      <div class="box"></div>
    `;
    div.querySelector('.box').textContent = it.text;
    const btn = div.querySelector('.copy-btn');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(it.text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = it.text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      btn.textContent = '✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '+'; btn.classList.remove('copied'); }, 1500);
    });
    if (it.link) {
      const lb = document.createElement('button');
      lb.type = 'button';
      lb.className = 'link-btn';
      lb.textContent = it.linkLabel || 'העתקת קישור';
      lb.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(it.link);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = it.link;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        lb.textContent = '✓ הקישור הועתק';
        lb.classList.add('copied');
        setTimeout(() => { lb.textContent = it.linkLabel || 'העתקת קישור'; lb.classList.remove('copied'); }, 1500);
      });
      div.appendChild(lb);
    }
    div._hay = it.cmd + ' ' + it.text;
    list.appendChild(div);
  });

  const qEl = document.getElementById('q');
  const noneEl = document.getElementById('none');
  function applyFilter() {
    let shown = 0;
    list.querySelectorAll('.item').forEach(d => {
      const ok = matchesAll(d._hay, qEl.value);
      d.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    noneEl.style.display = shown ? 'none' : 'block';
  }
  qEl.addEventListener('input', applyFilter);
  const pre = new URLSearchParams(location.search).get('q');
  if (pre) { qEl.value = pre; applyFilter(); }
</script>
</body>
</html>
